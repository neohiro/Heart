# Per-scope env vars. ${VAR} references are expanded by Heart at run-time
# (see HEART_SCHEDULE_REGISTRY.md § 4). The YAML parser never sees the
# substitution.
NEOHIRO_REGISTRY: "/shared/heart/schedules/REGISTRY.yaml"
NEOHIRO_DEPENDABOT_OUT: "/shared/net/public"
NEOHIRO_GITHUB_TOKEN: "${NEOHIRO_GITHUB_TOKEN}"
NEOHIRO_DEPENDABOT_TIMEOUT: "20"